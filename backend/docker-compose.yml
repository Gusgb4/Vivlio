services:
  postgres:
    image: postgres:16-alpine
    container_name: vivlio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vivlio
      POSTGRES_USER: vivlio
      POSTGRES_PASSWORD: vivlio
    ports:
      - "5432:5432"
    volumes:
      - vivlio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivlio -d vivlio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vivlio-pgdata:
